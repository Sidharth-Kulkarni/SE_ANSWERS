apiVersion: v1
kind: Service
metadata:
  name: vehicle-rental-service
  labels:
    app: vehicle-rental
spec:
  type: NodePort
  selector:
    app: vehicle-rental      # sends traffic to every pod with this label
  ports:
    - name: http
      port: 80               # port of the Service inside the cluster
      targetPort: 8080       # Tomcat port inside the pods
      nodePort: 30080        # port opened on the Minikube node (range 30000-32767)