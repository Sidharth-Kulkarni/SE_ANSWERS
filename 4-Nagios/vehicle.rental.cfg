###############################################################################
# vehicle-rental.cfg
# Nagios monitoring for the Vehicle Rental Management System
#
# Copy into the Nagios container at: /opt/nagios/etc/objects/vehicle-rental.cfg
# Hosts are Docker container names on the shared network "vr-net":
#   vr-app   = Tomcat running the Vehicle Rental WAR (port 8080)
#   vr-mysql = MySQL database (port 3306)
###############################################################################


###############################################################################
# COMMANDS
###############################################################################

# CPU load per CPU core: -w / -c = 1, 5, 15 minute averages
define command {
    command_name    vr_check_load
    command_line    $USER1$/check_load -r -w $ARG1$ -c $ARG2$
}

# Memory used in percent (custom plugin: scripts/check_mem.sh)
define command {
    command_name    vr_check_mem
    command_line    $USER1$/check_mem.sh -w $ARG1$ -c $ARG2$
}

# Free disk space on a mount point
define command {
    command_name    vr_check_disk
    command_line    $USER1$/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

# Server uptime, alert on a recent reboot (custom plugin: scripts/check_uptime.sh)
define command {
    command_name    vr_check_uptime
    command_line    $USER1$/check_uptime.sh -w $ARG1$ -c $ARG2$
}

# Ping: round-trip time (ms) and packet loss (%)
define command {
    command_name    vr_check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

# HTTP: the app page must return 200 and contain the given text
# ARG1=port ARG2=URL path ARG3=expected text ARG4=warn sec ARG5=crit sec
define command {
    command_name    vr_check_http_app
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -s "$ARG3$" -w $ARG4$ -c $ARG5$
}

# TCP port check: ARG1=port ARG2=warn sec ARG3=crit sec
define command {
    command_name    vr_check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

# OPTIONAL real MySQL login check (only if /opt/nagios/libexec/check_mysql exists)
#define command {
#    command_name    vr_check_mysql
#    command_line    $USER1$/check_mysql -H $HOSTADDRESS$ -u $ARG1$ -p $ARG2$ -d $ARG3$
#}


###############################################################################
# HOSTS
###############################################################################

define host {
    use                     linux-server
    host_name               vehicle-rental-server
    alias                   Vehicle Rental Application Server (Tomcat)
    address                 vr-app
    max_check_attempts      3
    check_interval          1
    retry_interval          1
}

define host {
    use                     linux-server
    host_name               vehicle-rental-db
    alias                   Vehicle Rental MySQL Database
    address                 vr-mysql
    parents                 vehicle-rental-server
    max_check_attempts      3
    check_interval          1
    retry_interval          1
}

define hostgroup {
    hostgroup_name          vehicle-rental
    alias                   Vehicle Rental Infrastructure
    members                 vehicle-rental-server,vehicle-rental-db
}


###############################################################################
# SERVICE TEMPLATE: check every minute so changes show quickly in the lab
###############################################################################

define service {
    name                    vr-service
    use                     generic-service
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    register                0
}


###############################################################################
# SERVICES: APPLICATION HOST RESOURCES
# (CPU, memory, disk and uptime are measured on the Docker host that runs
#  the app container; Nagios runs on the same Docker host)
###############################################################################

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     CPU Load
    check_command           vr_check_load!0.70,0.60,0.50!0.90,0.80,0.70
}

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     Memory Usage
    check_command           vr_check_mem!80!90
}

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     Disk Usage
    check_command           vr_check_disk!20%!10%!/
}

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     Server Uptime
    check_command           vr_check_uptime!30!5
}

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     PING
    check_command           vr_check_ping!100.0,20%!500.0,60%
}


###############################################################################
# SERVICES: APPLICATION AND DATABASE
###############################################################################

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     HTTP Vehicle Rental App
    check_command           vr_check_http_app!8080!/VehicleRentalManagement/!Vehicle Rental!2!5
}

define service {
    use                     vr-service
    host_name               vehicle-rental-server
    service_description     Tomcat Port 8080
    check_command           vr_check_tcp!8080!1!3
}

define service {
    use                     vr-service
    host_name               vehicle-rental-db
    service_description     MySQL Port 3306
    check_command           vr_check_tcp!3306!1!3
}

